# Publishes prebuilt, verified binaries from branch `release-bin` as a DRAFT GitHub Release.
# The draft becomes public only when the maintainer presses Publish.
name: publish-prebuilt
on:
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. v0.3.1", required: true }
permissions: { contents: write }
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: release-bin }
      - name: Checksums
        run: |
          cd bin && sha256sum Argus-Setup.exe Argus-Node.apk > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "${{ inputs.tag }}" bin/Argus-Setup.exe bin/Argus-Node.apk bin/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --draft --target main \
            --title "Argus ${{ inputs.tag }}" --notes-file bin/NOTES.md
