[package]
name = "usb-cluster"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
sysinfo = "0.32"
log = "0.4"

# Agent mode: screenshot + mouse/keyboard (Windows only; stubs elsewhere)
[target.'cfg(windows)'.dependencies]
xcap = "0.9"
enigo = "0.6"
base64 = "0.22"
