[package]
name = "usb-cluster"
version = "0.3.4"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
sysinfo = "0.32"
log = "0.4"
# 0.3.1 self-update: GitHub releases (rustls + ring, no OpenSSL / no system TLS), SHA-256 verification
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
# «Знания»/«Очередь»: .docx is a ZIP (deflate), PDF streams are zlib
flate2 = "1"

# Agent mode: screenshot + mouse/keyboard (Windows only; stubs elsewhere)
[target.'cfg(windows)'.dependencies]
xcap = "0.9"
enigo = "0.6"
base64 = "0.22"
